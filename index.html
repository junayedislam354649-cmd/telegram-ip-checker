<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IP Verification</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: #0b0f14;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 480px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 27px;
        }

        .header p {
            margin-top: 8px;
            color: #8d99a8;
            font-size: 14px;
        }

        .status-card {
            background: #151b23;
            border: 1px solid #222b36;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            background: #202934;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .title {
            font-size: 15px;
            font-weight: 600;
        }

        .subtitle {
            margin-top: 4px;
            color: #7f8b99;
            font-size: 12px;
        }

        .status {
            font-size: 13px;
            font-weight: 600;
            color: #8d99a8;
            text-align: right;
        }

        .status.success {
            color: #32d583;
        }

        .status.loading {
            color: #5ca9ff;
        }

        .status.failed {
            color: #ff6b6b;
        }

        .return-button {
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 16px;
            margin-top: 18px;
            background: #2481cc;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .return-button:active {
            transform: scale(0.98);
        }

        .error {
            text-align: center;
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            margin-bottom: 8px;
            color: #6f7b89;
            font-size: 12px;
        }

        .footer a {
            color: #5ca9ff;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:active {
            opacity: 0.7;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>IP Verification</h1>
        <p>Security verification in progress</p>
    </div>


    <!-- SYSTEM -->
    <div class="status-card">
        <div class="status-left">

            <div class="icon">⚙️</div>

            <div>
                <div class="title">Loading system</div>
                <div class="subtitle">
                    Preparing verification system
                </div>
            </div>

        </div>

        <div id="systemStatus" class="status loading">
            Checking...
        </div>
    </div>


    <!-- IP -->
    <div class="status-card">
        <div class="status-left">

            <div class="icon">🌐</div>

            <div>
                <div class="title">Checking IP</div>
                <div class="subtitle">
                    Verifying your connection
                </div>
            </div>

        </div>

        <div id="ipStatus" class="status">
            Waiting
        </div>
    </div>


    <!-- MULTIPLE ACCOUNTS -->
    <div class="status-card">
        <div class="status-left">

            <div class="icon">👤</div>

            <div>
                <div class="title">
                    Checking multiple accounts
                </div>

                <div class="subtitle">
                    Checking verification status
                </div>
            </div>

        </div>

        <div id="accountStatus" class="status">
            Waiting
        </div>
    </div>


    <div id="errorMessage" class="error">
        Verification failed. Please try again.
    </div>


    <button class="return-button" onclick="returnToBot()">
        Return to Bot
    </button>


    <div class="footer">
        This API made by
        <a
            href="https://t.me/CallJunaeid"
            target="_blank"
        >
            @CallJunaeid
        </a>
    </div>

</div>


<script>

    // ==================================
    // TELEGRAM WEB APP
    // ==================================

    const tg =
        window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // ==================================
    // API CONFIG
    // ==================================

    const API_URL =
        "https://checker.junayedislam354649.workers.dev/api/check";

    const BOT_URL =
        "https://t.me/Starfreearn_bot";


    // ==================================
    // TELEGRAM USER ID
    // ==================================

    const tgUser =
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user
            ? tg.initDataUnsafe.user.id
            : null;


    // ==================================
    // VERIFICATION STATE
    // ==================================

    let verificationPassed = false;


    // ==================================
    // SLEEP
    // ==================================

    function sleep(ms) {

        return new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    ms
                )
        );

    }


    // ==================================
    // START VERIFICATION
    // ==================================

    async function startVerification() {

        const systemStatus =
            document.getElementById(
                "systemStatus"
            );

        const ipStatus =
            document.getElementById(
                "ipStatus"
            );

        const accountStatus =
            document.getElementById(
                "accountStatus"
            );

        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        try {

            // ==================================
            // SYSTEM LOADING
            // ==================================

            await sleep(800);

            systemStatus.textContent =
                "System loaded";

            systemStatus.classList.remove(
                "loading"
            );

            systemStatus.classList.add(
                "success"
            );


            // ==================================
            // CHECK IP
            // ==================================

            ipStatus.textContent =
                "Checking...";

            ipStatus.classList.add(
                "loading"
            );


            const apiUrl =
                API_URL +
                "?user_id=" +
                encodeURIComponent(
                    tgUser || ""
                ) +
                "&t=" +
                Date.now();


            // ==================================
            // API REQUEST
            // ==================================

            const controller =
                new AbortController();

            const timeout =
                setTimeout(
                    () => {
                        controller.abort();
                    },
                    10000
                );


            let response;


            try {

                response =
                    await fetch(
                        apiUrl,
                        {
                            method: "GET",
                            mode: "cors",
                            cache: "no-store",
                            signal:
                                controller.signal
                        }
                    );

            } finally {

                clearTimeout(
                    timeout
                );

            }


            // ==================================
            // RESPONSE
            // ==================================

            if (!response.ok) {

                throw new Error(
                    "API returned HTTP " +
                    response.status
                );

            }


            const data =
                await response.json();


            // ==================================
            // CHECK API SUCCESS
            // ==================================

            if (!data.success) {

                throw new Error(
                    "Verification failed"
                );

            }


            // ==================================
            // IP CHECKED
            // ==================================

            await sleep(500);

            ipStatus.textContent =
                "IP checked";

            ipStatus.classList.remove(
                "loading"
            );

            ipStatus.classList.add(
                "success"
            );


            await sleep(700);


            // ==================================
            // 🚫 BANNED
            // ==================================

            if (
                data.banned === true
            ) {

                accountStatus.textContent =
                    "IP detected";

                accountStatus.classList.remove(
                    "loading"
                );

                accountStatus.classList.add(
                    "failed"
                );

                errorMessage.textContent =
                    "🚫 IP detected. You are banned.";

                errorMessage.style.display =
                    "block";


                verificationPassed =
                    false;


                return;

            }


            // ==================================
            // ✅ ALREADY VERIFIED
            // ==================================

            if (
                data.already_verified === true
            ) {

                accountStatus.textContent =
                    "Already verified";

                accountStatus.classList.remove(
                    "loading"
                );

                accountStatus.classList.add(
                    "success"
                );


                errorMessage.textContent =
                    "✅ You are already verified.";

                errorMessage.style.display =
                    "block";


                verificationPassed =
                    true;


                await sleep(1500);


                // ==================================
                // OPEN BOT
                // ==================================

                const botLink =
                    BOT_URL +
                    "?start=already_verified";


                if (
                    window.Telegram &&
                    window.Telegram.WebApp
                ) {

                    tg.openTelegramLink(
                        botLink
                    );

                } else {

                    window.location.href =
                        botLink;

                }


                return;

            }


            // ==================================
            // 🆕 NEW USER / NEW IP
            // ==================================

            accountStatus.textContent =
                "Multiple not detected";

            accountStatus.classList.remove(
                "loading"
            );

            accountStatus.classList.add(
                "success"
            );


            verificationPassed =
                true;


            await sleep(1000);


            // ==================================
            // OPEN BOT WITH TOKEN
            // ==================================

            if (data.token) {

                const botLink =
                    BOT_URL +
                    "?start=verified_" +
                    data.token;


                if (
                    window.Telegram &&
                    window.Telegram.WebApp
                ) {

                    tg.openTelegramLink(
                        botLink
                    );

                } else {

                    window.location.href =
                        botLink;

                }


                return;

            }


            // ==================================
            // TOKEN MISSING
            // ==================================

            throw new Error(
                "Verification token missing"
            );


        } catch (error) {

            console.error(
                "Verification error:",
                error
            );


            // ==================================
            // ERROR MESSAGE
            // ==================================

            if (
                error.name ===
                "AbortError"
            ) {

                errorMessage.textContent =
                    "⚠️ Verification server timeout. Please try again.";

            } else {

                errorMessage.textContent =
                    "⚠️ " +
                    error.message;

            }


            errorMessage.style.display =
                "block";


            // ==================================
            // FAILED STATUS
            // ==================================

            ipStatus.textContent =
                "Failed";

            ipStatus.classList.remove(
                "loading"
            );

            ipStatus.classList.add(
                "failed"
            );


            accountStatus.textContent =
                "Failed";

            accountStatus.classList.remove(
                "loading"
            );

            accountStatus.classList.add(
                "failed"
            );


            verificationPassed =
                false;

        }

    }


    // ==================================
    // 🔙 RETURN TO BOT
    // ==================================

    function returnToBot() {

        // ==================================
        // NOT VERIFIED
        // ==================================

        if (!verificationPassed) {

            const errorMessage =
                document.getElementById(
                    "errorMessage"
                );

            errorMessage.textContent =
                "🚫 Verification failed. You cannot return to the Main Menu.";

            errorMessage.style.display =
                "block";

            return;
        }


        // ==================================
        // VERIFIED
        // ==================================

        const botLink =
            BOT_URL +
            "?start=already_verified";


        if (
            window.Telegram &&
            window.Telegram.WebApp
        ) {

            tg.openTelegramLink(
                botLink
            );

            setTimeout(
                () => {
                    tg.close();
                },
                300
            );

        } else {

            window.location.href =
                botLink;

        }

    }

    // ==================================
    // 🚀 START
    // ==================================

    startVerification();

</script>


</body>
</html>
