<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IP Verification</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: #0b0f14;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 480px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 27px;
        }

        .header p {
            margin-top: 8px;
            color: #8d99a8;
            font-size: 14px;
        }

        .status-card {
            background: #151b23;
            border: 1px solid #222b36;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            background: #202934;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .title {
            font-size: 15px;
            font-weight: 600;
        }

        .subtitle {
            margin-top: 4px;
            color: #7f8b99;
            font-size: 12px;
        }

        .status {
            font-size: 13px;
            font-weight: 600;
            color: #8d99a8;
            text-align: right;
        }

        .status.success {
            color: #32d583;
        }

        .status.loading {
            color: #5ca9ff;
        }

        .status.failed {
            color: #ff6b6b;
        }

        .return-button {
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 16px;
            margin-top: 18px;
            background: #2481cc;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .return-button:active {
            transform: scale(0.98);
        }

        .error {
            text-align: center;
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            margin-bottom: 8px;
            color: #6f7b89;
            font-size: 12px;
        }

        .footer a {
            color: #5ca9ff;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:active {
            opacity: 0.7;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>IP Verification</h1>
        <p>Security verification in progress</p>
    </div>


    <!-- SYSTEM -->
    <div class="status-card">
        <div class="status-left">

            <div class="icon">⚙️</div>

            <div>
                <div class="title">Loading system</div>
                <div class="subtitle">
                    Preparing verification system
                </div>
            </div>

        </div>

        <div id="systemStatus" class="status loading">
            Checking...
        </div>
    </div>


    <!-- IP -->
    <div class="status-card">
        <div class="status-left">

            <div class="icon">🌐</div>

            <div>
                <div class="title">Checking IP</div>
                <div class="subtitle">
                    Verifying your connection
                </div>
            </div>

        </div>

        <div id="ipStatus" class="status">
            Waiting
        </div>
    </div>


    <!-- MULTIPLE ACCOUNTS -->
    <div class="status-card">
        <div class="status-left">

            <div class="icon">👤</div>

            <div>
                <div class="title">
                    Checking multiple accounts
                </div>

                <div class="subtitle">
                    Checking verification status
                </div>
            </div>

        </div>

        <div id="accountStatus" class="status">
            Waiting
        </div>
    </div>


    <div id="errorMessage" class="error">
        Verification failed. Please try again.
    </div>


    <button class="return-button" onclick="returnToBot()">
        Return to Bot
    </button>


    <div class="footer">
        This API made by
        <a
            href="https://t.me/CallJunaeid"
            target="_blank"
        >
            @CallJunaeid
        </a>
    </div>

</div>


<script>

    const tg =
        window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const API_URL =
        "https://checker.junayedislam354649.workers.dev/api/check";

    const VERIFY_API =
        "https://checker.junayedislam354649.workers.dev/api/verify";

    const BOT_URL =
        "https://t.me/Starfreearn_bot";

    function sleep(ms) {
        return new Promise(
            resolve => setTimeout(resolve, ms)
        );
    }

    async function startVerification() {

        const systemStatus =
            document.getElementById("systemStatus");

        const ipStatus =
            document.getElementById("ipStatus");

        const accountStatus =
            document.getElementById("accountStatus");

        const errorMessage =
            document.getElementById("errorMessage");

        try {

            await sleep(800);

            systemStatus.textContent =
                "System loaded";

            systemStatus.classList.remove(
                "loading"
            );

            systemStatus.classList.add(
                "success"
            );

            ipStatus.textContent =
                "Checking...";

            ipStatus.classList.add(
                "loading"
            );

            const response =
                await fetch(API_URL);

            if (!response.ok) {

                throw new Error(
                    "API request failed"
                );

            }

            const data =
                await response.json();

            if (!data.success) {

                throw new Error(
                    "Verification failed"
                );

            }

            await sleep(500);

            ipStatus.textContent =
                "IP checked";

            ipStatus.classList.remove(
                "loading"
            );

            ipStatus.classList.add(
                "success"
            );

            await sleep(700);

            // ==================================
            // MULTIPLE ACCOUNT
            // ==================================

            if (data.multiple === true) {

                accountStatus.textContent =
                    "Multiple detected";

                accountStatus.classList.add(
                    "failed"
                );

                errorMessage.textContent =
                    "Multiple account detected. Verification failed.";

                errorMessage.style.display =
                    "block";

                return;
            }

            // ==================================
            // NEW IP
            // ==================================

            accountStatus.textContent =
                "Multiple not detected";

            accountStatus.classList.add(
                "success"
            );

            await sleep(1000);

            // ==================================
            // OPEN BOT WITH TOKEN
            // ==================================

            if (data.token) {

                const botLink =
                    BOT_URL +
                    "?start=verified_" +
                    data.token;

                if (
                    window.Telegram &&
                    window.Telegram.WebApp
                ) {

                    tg.openTelegramLink(
                        botLink
                    );

                } else {

                    window.location.href =
                        botLink;

                }

                return;
            }

        } catch (error) {

            console.error(error);

            errorMessage.textContent =
                "Verification failed. Please try again.";

            errorMessage.style.display =
                "block";

            ipStatus.textContent =
                "Failed";

            ipStatus.classList.remove(
                "loading"
            );

            ipStatus.classList.add(
                "failed"
            );

            accountStatus.textContent =
                "Failed";

            accountStatus.classList.add(
                "failed"
            );
        }
    }

    function returnToBot() {

        if (
            window.Telegram &&
            window.Telegram.WebApp
        ) {

            tg.close();

        } else {

            history.back();

        }
    }

    startVerification();

</script>

</body>
</html>
